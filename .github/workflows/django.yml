name: Portfolio source and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  phone-tracker:
    name: Phone Tracker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Phone Tracker dependencies
        run: python -m pip install -r "Python/Console Apps/Utilities/Phone Tracker/requirements.txt"
      - name: Run Phone Tracker unit tests
        run: python -m unittest discover -s "Python/Console Apps/Utilities/Phone Tracker" -p "test_*.py" -v

  source-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run repository security regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
