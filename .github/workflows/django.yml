name: Portfolio source and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hayden-django:
    name: Hayden Django application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAYDEN_DJANGO_SECRET_KEY: ci-hayden-test-key-with-at-least-fifty-characters-and-varied-alphabet-2026
      HAYDEN_DJANGO_DEBUG: "true"
      HAYDEN_DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "Python/Frameworks/Django/Hayden/requirements.txt"
      - name: Install Hayden application dependencies
        working-directory: Python/Frameworks/Django/Hayden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Hayden application source
        working-directory: Python/Frameworks/Django/Hayden
        run: python -m compileall -q .
      - name: Run Django system checks
        working-directory: Python/Frameworks/Django/Hayden
        run: python manage.py check
      - name: Apply migrations to a disposable CI database
        working-directory: Python/Frameworks/Django/Hayden
        env:
          HAYDEN_DJANGO_DB_NAME: ${{ runner.temp }}/hayden-ci.sqlite3
        run: python manage.py migrate --noinput
      - name: Run Hayden application tests
        working-directory: Python/Frameworks/Django/Hayden
        env:
          HAYDEN_DJANGO_DB_NAME: ${{ runner.temp }}/hayden-ci.sqlite3
        run: python manage.py test --verbosity 2

  streamlit-biller:
    name: Streamlit bill calculator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Python/Frameworks/Streamlit/Cell Phone Biller/requirements.txt"
      - name: Install bill calculator dependencies
        working-directory: Python/Frameworks/Streamlit/Cell Phone Biller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile the bill calculator
        working-directory: Python/Frameworks/Streamlit/Cell Phone Biller
        run: python -m compileall -q app.py test_tmobile_calculator.py
      - name: Run synthetic bill calculator tests
        working-directory: Python/Frameworks/Streamlit/Cell Phone Biller
        run: python -m unittest -v test_tmobile_calculator

  hires-django:
    name: Hires Django application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HIRES_DJANGO_SECRET_KEY: ci-hires-test-key-with-at-least-fifty-characters-and-varied-alphabet-2026
      HIRES_DJANGO_DEBUG: "true"
      HIRES_DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Python/Frameworks/Django/Hires/requirements.txt"
      - name: Install Hires application dependencies
        working-directory: Python/Frameworks/Django/Hires
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Hires application source
        working-directory: Python/Frameworks/Django/Hires
        run: python -m compileall -q .
      - name: Run Django system checks
        working-directory: Python/Frameworks/Django/Hires
        run: python manage.py check
      - name: Apply migrations to the disposable CI database
        working-directory: Python/Frameworks/Django/Hires
        env:
          HIRES_DJANGO_DB_NAME: ${{ runner.temp }}/hires-ci.sqlite3
        run: python manage.py migrate --noinput
      - name: Run Hires application tests
        working-directory: Python/Frameworks/Django/Hires
        env:
          HIRES_DJANGO_DB_NAME: ${{ runner.temp }}/hires-ci.sqlite3
        run: python manage.py test --verbosity 2
  job-analyzer-django:
    name: Job Analyzer private-data checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB_ANALYZER_DJANGO_SECRET_KEY: ci-job-analyzer-test-key-with-at-least-fifty-characters-and-varied-alphabet-2026
      JOB_ANALYZER_DJANGO_DEBUG: "true"
      JOB_ANALYZER_DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Python/Frameworks/Django/Job Analyzer/requirements.txt"
      - name: Install Job Analyzer dependencies
        working-directory: Python/Frameworks/Django/Job Analyzer/jobanalyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt
      - name: Compile Job Analyzer source
        working-directory: Python/Frameworks/Django/Job Analyzer/jobanalyzer
        run: python -m compileall -q .
      - name: Run Django system checks
        working-directory: Python/Frameworks/Django/Job Analyzer/jobanalyzer
        run: python manage.py check
      - name: Apply migrations to a disposable CI database
        working-directory: Python/Frameworks/Django/Job Analyzer/jobanalyzer
        env:
          JOB_ANALYZER_DJANGO_DB_NAME: ${{ runner.temp }}/job-analyzer-ci.sqlite3
        run: python manage.py migrate --noinput
      - name: Run Job Analyzer application tests
        working-directory: Python/Frameworks/Django/Job Analyzer/jobanalyzer
        env:
          JOB_ANALYZER_DJANGO_DB_NAME: ${{ runner.temp }}/job-analyzer-ci.sqlite3
        run: python manage.py test --verbosity 2

  phone-tracker:
    name: Phone Tracker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Phone Tracker dependencies
        run: python -m pip install -r "Python/Console Apps/Utilities/Phone Tracker/requirements.txt"
      - name: Run Phone Tracker unit tests
        run: python -m unittest discover -s "Python/Console Apps/Utilities/Phone Tracker" -p "test_*.py" -v

  source-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run repository security regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
