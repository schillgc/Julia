name: Portfolio source and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  hires-django:
    name: Hires Django application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HIRES_DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      HIRES_DJANGO_DEBUG: "true"
      HIRES_DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Python/Frameworks/Django/Hires/requirements.txt"
      - name: Install Hires application dependencies
        working-directory: Python/Frameworks/Django/Hires
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Hires application source
        working-directory: Python/Frameworks/Django/Hires
        run: python -m compileall -q .
      - name: Run Django system checks
        working-directory: Python/Frameworks/Django/Hires
        run: python manage.py check
      - name: Apply migrations to the disposable CI database
        working-directory: Python/Frameworks/Django/Hires
        env:
          HIRES_DJANGO_DB_NAME: ${{ runner.temp }}/hires-ci.sqlite3
        run: python manage.py migrate --noinput
      - name: Run Hires application tests
        working-directory: Python/Frameworks/Django/Hires
        env:
          HIRES_DJANGO_DB_NAME: ${{ runner.temp }}/hires-ci.sqlite3
        run: python manage.py test --verbosity 2
  phone-tracker:
    name: Phone Tracker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Phone Tracker dependencies
        run: python -m pip install -r "Python/Console Apps/Utilities/Phone Tracker/requirements.txt"
      - name: Run Phone Tracker unit tests
        run: python -m unittest discover -s "Python/Console Apps/Utilities/Phone Tracker" -p "test_*.py" -v

  source-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run repository security regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
