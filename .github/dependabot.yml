version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directories:
      - "/Python/Console Apps/Utilities/Phone Tracker"
      - "/Python/Frameworks/Django/Hayden"
      - "/Python/Frameworks/Django/Hires"
      - "/Python/Frameworks/Django/Job*"
      - "/Python/Frameworks/PyGame/AI Maze"
      - "/Python/Frameworks/Streamlit/Cell Phone Biller"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    exclude-paths:
      - "Mazes/**"
