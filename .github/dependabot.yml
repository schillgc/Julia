version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The AI Maze folder contains plaintext maze fixtures that are not
    # Python requirement files. Exclude the fixtures while scanning the
    # archive's real requirements/Pipfile/pyproject manifests recursively.
    exclude-paths:
      - "Python/Frameworks/PyGame/AI Maze/Mazes/**"
